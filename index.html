  <style>
    /* Scrollbar oscura con acento azul */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #050B14;
    }

    ::-webkit-scrollbar-thumb {
      background: #1B4F72;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2E86AB;
    }

    /* Selección de texto */
    ::selection {
      background: rgba(230, 126, 34, 0.3);
      color: #F0F4FF;
    }

    *:focus-visible {
      outline: 2px solid #5DADE2;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      background: #050B14;
      overflow-x: hidden;
    }
  </style>
  <script>
    (function () {
      // ── Consent Mode v2: denied por defecto antes de cargar cualquier tag ──
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      });

      // ── Loader idempotente global (lo llama el banner al aceptar) ──
      window.loadGTM = function () {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        var w = window, d = document, l = 'dataLayer';
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName('script')[0],
          j = d.createElement('script'),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-PD4GT9W4' + dl;
        f.parentNode.insertBefore(j, f);
      };

      // ── Si el usuario ya aceptó antes → cargar GTM diferido ──
      var consent = localStorage.getItem('ds_cookie_consent');
      if (consent === 'accepted') {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          analytics_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(window.loadGTM, { timeout: 3000 });
        } else {
          setTimeout(window.loadGTM, 2000);
        }
      }
      // 'rejected' o null → GTM no carga; espera a que el banner decida
    })();
  </script>
