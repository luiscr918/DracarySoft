<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/dracarysAlternativeLogo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/styles/tailwind.css" rel="stylesheet">
  <title>DracarySoft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <style>
    /* Cursor personalizado con color fuego */
    * {
      cursor: default;
    }

    a,
    button,
    [role="button"] {
      cursor: pointer;
    }

    /* Scrollbar oscura con acento azul */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #050B14;
    }

    ::-webkit-scrollbar-thumb {
      background: #1B4F72;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2E86AB;
    }

    /* Selección de texto */
    ::selection {
      background: rgba(230, 126, 34, 0.3);
      color: #F0F4FF;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050B14;
      overflow-x: hidden;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
